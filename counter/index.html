<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Counter — Executive Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0F1B2D; --muted: #5A6472; --line: #E3E1DA; --bg: #F7F6F2; --accent: #C98A2B; --ok: #2E7D4F; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font: 800 24px Manrope, Inter, sans-serif; margin: 0; }
  h2 { font: 700 15px Manrope, Inter, sans-serif; margin: 0 0 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .gate { max-width: 420px; margin: 12vh auto 0; }
  .gate input, .gate button { width: 100%; height: 42px; border-radius: 8px; font: inherit; }
  .gate input { border: 1px solid var(--line); padding: 0 12px; margin: 10px 0; }
  button { cursor: pointer; border: 0; background: var(--ink); color: #fff; font: 600 13px Inter, sans-serif; border-radius: 8px; padding: 0 14px; height: 36px; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: transparent; color: #A33; border: 1px solid #E6C9C9; height: 30px; padding: 0 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { background: transparent; color: var(--muted); border-radius: 0; height: 32px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .tile .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font: 800 28px Manrope, Inter, sans-serif; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 6px 4px; border-top: 1px solid #EEECE6; text-align: left; vertical-align: top; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 6px; background: #F3EBDD; border-radius: 3px; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .owner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #E7F2EC; color: var(--ok); font-weight: 600; }
  .me { background: #FFF7E8; }
  #chart svg { display: block; width: 100%; height: 200px; }
  .err { color: #A33; font-size: 13px; min-height: 18px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  @media (max-width: 760px) { .tiles, .grid2 { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="../data.js"></script>
<script>
(function () {
  var API = 'https://vicetirlflvnbsgsqqbr.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_V4v_TQIhUacnJfrDsIWN9g_Clka-KWs';
  var root = document.getElementById('root');
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
  var days = +(ls.get('pf_days') || 30);
  var titles = {};
  try { (window.PORTFOLIO.cases || []).forEach(function (c) { titles[c.id] = c.en.t; }); } catch (e) {}
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rpc(fn, body) {
    return fetch(API + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error(r.status === 403 || r.status === 401 ? 'forbidden' : 'HTTP ' + r.status); return r.json(); });
  }
  function myVid() { return ls.get('pf_vid'); }

  function gate(msg) {
    root.innerHTML = '<div class="card gate"><h1>Counter</h1><p class="sub">Página privada. Digite sua chave de acesso.</p>' +
      '<form id="f"><input id="k" type="password" autocomplete="current-password" placeholder="Chave de acesso" autofocus><button>Entrar</button></form><p class="err">' + esc(msg || '') + '</p></div>';
    document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var k = document.getElementById('k').value.trim(); if (k) load(k); };
  }

  function load(k) {
    root.innerHTML = '<p class="sub">Carregando…</p>';
    Promise.all([rpc('pf_stats', { p_key: k, p_days: days }), rpc('pf_recent', { p_key: k })]).then(function (r) {
      ls.set('pf_key', k); ls.set('pf_owner', '1'); view(k, r[0], r[1]);
    }).catch(function (e) { ls.set('pf_key', null); gate(e.message === 'forbidden' ? 'Chave inválida.' : 'Erro ao carregar: ' + e.message); });
  }

  function list(title, rows, label, extra) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.views; }).concat([1]));
    return '<div class="card"><h2>' + title + '</h2>' + (rows.length ? '<table><tr><th>' + (extra || '') + '</th><th class="n">Views</th></tr>' + rows.map(function (r) {
      return '<tr><td>' + label(r) + '<div class="bar"><i style="width:' + Math.round(100 * r.views / max) + '%"></i></div></td><td class="n">' + r.views + (r.visitors != null ? ' <span class="sub">· ' + r.visitors + ' únicos</span>' : '') + '</td></tr>';
    }).join('') + '</table>' : '<p class="sub">Sem dados no período.</p>') + '</div>';
  }

  function chart(rows) {
    var W = 1000, H = 200, P = 24, n = rows.length || 1, max = Math.max.apply(null, rows.map(function (r) { return r.views; }).concat([1]));
    var bw = (W - P) / n, out = '';
    rows.forEach(function (r, i) {
      var x = P + i * bw, h1 = (H - 30) * r.views / max, h2 = (H - 30) * r.visitors / max;
      out += '<g><title>' + r.day + ': ' + r.views + ' views, ' + r.visitors + ' visitantes</title>' +
        '<rect x="' + (x + bw * 0.12) + '" y="' + (H - 20 - h1) + '" width="' + (bw * 0.76) + '" height="' + h1 + '" fill="#E9D4B0" rx="2"/>' +
        '<rect x="' + (x + bw * 0.12) + '" y="' + (H - 20 - h2) + '" width="' + (bw * 0.76) + '" height="' + h2 + '" fill="#C98A2B" rx="2"/></g>';
      var step = Math.ceil(n / 10);
      if (i % step === 0 || i === n - 1) out += '<text x="' + (x + bw / 2) + '" y="' + (H - 4) + '" font-size="11" fill="#5A6472" text-anchor="middle">' + r.day.slice(8, 10) + '/' + r.day.slice(5, 7) + '</text>';
    });
    out += '<text x="0" y="12" font-size="11" fill="#5A6472">' + max + '</text><line x1="' + P + '" x2="' + W + '" y1="' + (H - 20) + '" y2="' + (H - 20) + '" stroke="#E3E1DA"/>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Visitas por dia">' + out + '</svg>';
  }

  function fmt(ts) { var d = new Date(ts); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

  function view(k, s, vis) {
    var me = myVid();
    var refLabel = function (r) { return esc(r.ref.replace(/^share:/, '🔗 link compartilhado · ')); };
    root.innerHTML =
      '<div class="top"><div><h1>Counter</h1><div class="sub">Executive Portfolio · visitas desde a ativação (horário de Brasília)</div></div>' +
      '<div class="seg" id="seg">' + [7, 30, 90, 365].map(function (d) { return '<button data-d="' + d + '" class="' + (d === days ? 'on' : '') + '">' + (d === 365 ? '1 ano' : d + ' dias') + '</button>'; }).join('') + '</div></div>' +
      '<div class="tiles">' +
        '<div class="card tile"><div class="k">Hoje</div><div class="v">' + s.today.views + '</div><div class="s">' + s.today.visitors + ' visitantes</div></div>' +
        '<div class="card tile"><div class="k">Últimos ' + days + ' dias</div><div class="v">' + s.period.views + '</div><div class="s">' + s.period.visitors + ' visitantes</div></div>' +
        '<div class="card tile"><div class="k">Total</div><div class="v">' + s.all_time.views + '</div><div class="s">' + s.all_time.visitors + ' visitantes</div></div>' +
        '<div class="card tile"><div class="k">Cases abertos</div><div class="v">' + s.by_case.reduce(function (a, r) { return a + r.views; }, 0) + '</div><div class="s">no período</div></div>' +
      '</div>' +
      '<div class="card" id="chart"><h2>Por dia</h2>' + chart(s.by_day) + '<div class="legend"><span style="--c:#E9D4B0">Views</span><span style="--c:#C98A2B">Visitantes únicos</span></div></div>' +
      '<div class="grid2">' +
        list('Cases mais vistos', s.by_case, function (r) { return esc(titles[r.case_id] || r.case_id); }, 'Case') +
        list('Origem', s.by_ref, refLabel, 'Fonte') +
        list('Idioma', s.by_lang, function (r) { return esc({ en: 'English', pt: 'Português', es: 'Español' }[r.lang] || r.lang); }, 'Idioma') +
        list('Dispositivo', s.by_device, function (r) { return r.device === 'mobile' ? 'Celular' : 'Desktop'; }, 'Tipo') +
      '</div>' +
      '<div class="card" style="margin-top:12px"><h2>Visitantes</h2><p class="sub" style="margin:0 0 8px">Cada linha é um navegador. A linha destacada é este navegador. Use “Remover” para apagar as visitas de um navegador seu.</p>' +
        (vis.length ? '<table><tr><th>Visitante</th><th>Primeira visita</th><th>Última visita</th><th class="n">Views</th><th></th></tr>' + vis.map(function (v) {
          var mine = v.vid === me;
          return '<tr class="' + (mine ? 'me' : '') + '"><td>' + (v.mobile ? '📱 ' : '💻 ') + esc(v.vid.slice(0, 8)) + (mine ? ' <span class="pill">este navegador</span>' : '') + '</td><td>' + fmt(v.first_seen) + '</td><td>' + fmt(v.last_seen) + '</td><td class="n">' + v.views + '</td><td class="n"><button class="danger" data-purge="' + esc(v.vid) + '">Remover</button></td></tr>';
        }).join('') + '</table>' : '<p class="sub">Nenhuma visita ainda.</p>') + '</div>' +
      '<div class="card owner" style="margin-top:12px"><span class="pill">✓ Este navegador não é contado</span><span class="sub">Abra esta página uma vez em cada aparelho seu (celular, notebook do trabalho) para que ele também deixe de ser contado.</span>' +
        '<span style="flex:1"></span><button class="ghost" id="out">Sair</button></div>';
    document.getElementById('seg').onclick = function (e) { var d = e.target.getAttribute('data-d'); if (d) { days = +d; ls.set('pf_days', d); load(k); } };
    document.getElementById('out').onclick = function () { ls.set('pf_key', null); gate(); };
    Array.prototype.forEach.call(root.querySelectorAll('[data-purge]'), function (b) {
      b.onclick = function () {
        if (!confirm('Apagar todas as visitas deste navegador?')) return;
        rpc('pf_purge', { p_key: k, p_vid: b.getAttribute('data-purge') }).then(function () { load(k); }).catch(function (e) { alert(e.message); });
      };
    });
  }

  var saved = ls.get('pf_key');
  if (saved) load(saved); else gate();
})();
</script>
</body>
</html>
